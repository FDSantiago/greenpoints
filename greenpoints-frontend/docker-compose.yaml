services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    init: true
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules   # keep container-installed deps separate from the host
    ports:
      - "5173:5173"
    environment:
      # Read by the BROWSER, so it must be a host-reachable URL (not "backend")
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # Only needed if file changes aren't detected (e.g. network drives / WSL)
      # CHOKIDAR_USEPOLLING: "true"

volumes:
  greenpoints-node_modules: