# Oracle Database 19c from Oracle's container registry.
# ONE-TIME SETUP on your computer (not inside the container):
#   1. Create a free Oracle account and accept the license for "Database > enterprise" at
#      https://container-registry.oracle.com
#   2. docker login container-registry.oracle.com
# The first start creates the database and takes 10-45 minutes. Watch it with:
#   docker compose -f .devcontainer/docker-compose.yml logs -f oracle     (wait for "DATABASE IS READY TO USE!")
#
# Using a 19c server your school gives you instead? Delete the `oracle` service and `depends_on`,
# then set DB_HOST / DB_SERVICE_NAME / DB_USERNAME / DB_PASSWORD below to your server's values.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_CONNECTION: oracle
      DB_HOST: oracle
      DB_PORT: "1521"
      DB_SERVICE_NAME: ORCLPDB1
      DB_DATABASE: ORCLPDB1
      DB_USERNAME: gp_owner
      DB_PASSWORD: GpOwner_Dev1
      DB_CHARSET: AL32UTF8
      DB_SERVER_VERSION: 19c
      ORA_MAX_NAME_LEN: "128"

  oracle:
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    # Built it yourself from github.com/oracle/docker-images instead? Use: image: oracle/database:19.3.0-ee
    restart: unless-stopped
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: Oracle_Dev_1          # password of SYS, SYSTEM and PDBADMIN (dev only!)
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "1521:1521"
      - "5500:5500"                      # EM Express
    shm_size: 1g
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 20s
      timeout: 10s
      retries: 120
      start_period: 5m

volumes:
  oracle-data:
