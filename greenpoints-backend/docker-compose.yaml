services:
  backend:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    command: >
      sh -c "composer install --no-interaction &&
             php artisan serve --host=0.0.0.0 --port=8000"