services:
  backend:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      # Each open notifications stream (one per browser tab) holds a worker, so keep plenty.
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-16}
    command: >
      sh -c "composer install --no-interaction &&
             php artisan serve --host=0.0.0.0 --port=8000 --no-reload"